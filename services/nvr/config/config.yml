# Frigate 0.17.x - home NVR
# Six Yi cameras on local-only custom firmware (cloud disabled).
#
# Design notes, all learned by debugging this stack - see docs/nvr-findings.md:
#  1. Each camera exposes ONE rtsp stream (ch0_0, main). ch0_1 is 404 because
#     upstream warns against enabling both streams on these weak SoCs. Since
#     detect and record share a single input, Frigate opens exactly ONE
#     connection per camera for recording/detection. The cam5 listening pilot
#     adds one on-demand go2rtc connection while live audio is being viewed.
#  2. detect width/height are set explicitly. Without them Frigate probes the
#     stream, and a probe timeout hits an upstream bug that crashes Frigate.
#  3. record uses audio-aac, NOT audio-copy. The MStar cameras emit PCM mu-law,
#     which MP4 cannot contain - audio-copy makes recording fail outright.

mqtt:
  enabled: false

# Live-listening pilot only. Keep the proven recording inputs unchanged until
# browser audio and stability are verified. One FFmpeg input supplies copied
# video plus AAC and Opus audio, using one additional camera connection.
# The measured cam5 audio RTP clock advances at roughly half real time.
# Build live-audio timestamps from sample count; leave recording args unchanged.
# See docs/live-audio-pilot.md for validation, limitations, and rollback.
#
# ROLLOUT NOTE 2026-09-12. cam2_living added as the second pilot camera, per
# step 2 of the handoff: one MStar camera at a time, validating each camera's
# own audio rather than assuming cam5's correction applies.
#
# Measured on all four MStar cameras before adding this - every one identical,
# pcm_s16be 8000 Hz mono with the audio clock at half real time:
#
#   camera          codec      rate  req  decoded  ratio  rms dBFS
#   cam1_mensroom   pcm_s16be  8000  10s  19.993s  2.00   -47.61
#   cam2_living     pcm_s16be  8000  10s  19.878s  1.99   -35.13
#   cam4_hallway    pcm_s16be  8000  10s  19.977s  2.00   -51.30
#   cam5_laundry    pcm_s16be  8000  10s  19.974s  2.00   -46.07
#
# Read that ratio as decoded/requested, NOT wall/decoded: `-t` limits by the
# stream's own timestamps, so wall/decoded looks like a healthy 1.0 and hides
# the fault completely. See scripts/probe-camera-audio.py.
#
# 2026-09-12, later: cam1 and cam4 added at the owner's direction, completing
# all four MStar cameras. Both were measured affected in the table above. Note
# both are wedge-prone - cam1 has wedged three times and cam4 twice in the last
# fortnight - and a wedged camera takes its live-audio stream down with it.
# That is a pre-existing camera fault, not caused by this stanza; the stream
# recovers when the camera is rebooted.
#
# cam3_kitchen and cam6_extra are Allwinner and have NO audio track at all.
# Adding a stanza for them cannot create a source track - see the Allwinner
# section of docs/live-audio-pilot.md.
go2rtc:
  streams:
    cam1_mensroom:
      - "ffmpeg:rtsp://192.168.3.5/ch0_0.h264#video=copy#audio=aac#audio=opus#raw=-bsf:v h264_metadata -af asetpts=N/SR/TB"
    cam2_living:
      - "ffmpeg:rtsp://192.168.3.22/ch0_0.h264#video=copy#audio=aac#audio=opus#raw=-bsf:v h264_metadata -af asetpts=N/SR/TB"
    cam4_hallway:
      - "ffmpeg:rtsp://192.168.3.4/ch0_0.h264#video=copy#audio=aac#audio=opus#raw=-bsf:v h264_metadata -af asetpts=N/SR/TB"
    cam5_laundry:
      - "ffmpeg:rtsp://192.168.3.149/ch0_0.h264#video=copy#audio=aac#audio=opus#raw=-bsf:v h264_metadata -af asetpts=N/SR/TB"

# ---------------------------------------------------------------------------
# Detector - RTX 4080 SUPER via ONNX/TensorRT
# ---------------------------------------------------------------------------
# Model built by scripts/build-yolo-model.sh (yolov9-t, 320x320).
# Frigate does not ship an ONNX model; it has to be exported once.
detectors:
  onnx:
    type: onnx

model:
  model_type: yolo-generic
  width: 320
  height: 320
  input_tensor: nchw
  input_dtype: float
  path: /config/model_cache/yolo.onnx
  labelmap_path: /labelmap/coco-80.txt

# ---------------------------------------------------------------------------
# Global defaults
# ---------------------------------------------------------------------------
ffmpeg:
  hwaccel_args: preset-nvidia

  # These cameras stall for seconds at a time under load. The stock
  # preset-rtsp-generic uses a 10s input timeout, and retry_interval
  # defaults to another 10s - so one brief stall cost 20s+ of recording.
  # Measured gaps of 30-70s per camera before this change.
  # 30s timeout rides through a stall instead of tearing the process down;
  # 3s retry gets it back faster when a teardown does happen.
  retry_interval: 3
  input_args:
    - -avoid_negative_ts
    - make_zero
    - -fflags
    - +genpts+discardcorrupt
    - -rtsp_transport
    - tcp
    - -timeout
    - "30000000"
    - -use_wallclock_as_timestamps
    - "1"

  output_args:
    # Preserve the measured MStar MP4 framing workaround. AUD/filler removal
    # was a disproven explanation: filters removing nothing also fix it.
    # Re-serialization works; the underlying cause remains unisolated.
    # See docs/recording-corruption.md. No video re-encode is performed.
    # This replaces preset-record-generic-audio-aac, matching it exactly plus
    # the bitstream filter.
    record:
      - -f
      - segment
      - -segment_time
      - "10"
      - -segment_format
      - mp4
      - -reset_timestamps
      - "1"
      - -strftime
      - "1"
      - -c:v
      - copy
      - -bsf:v
      - filter_units=remove_types=9|12
      - -c:a
      - aac

detect:
  enabled: true
  fps: 5

objects:
  track:
    - person

record:
  enabled: true
  continuous:
    days: 2
  alerts:
    retain:
      days: 14
      mode: motion
  detections:
    retain:
      days: 7
      mode: motion

snapshots:
  enabled: true
  retain:
    default: 14

# ---------------------------------------------------------------------------
# Cameras
# ---------------------------------------------------------------------------
cameras:
  # MStar y203c cameras report 1920x1088
  cam1_mensroom:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://192.168.3.5/ch0_0.h264
          roles: [detect, record]
    detect:
      width: 1920
      height: 1088

  cam2_living:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://192.168.3.22/ch0_0.h264
          roles: [detect, record]
    detect:
      width: 1920
      height: 1088

  cam4_hallway:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://192.168.3.4/ch0_0.h264
          roles: [detect, record]
    detect:
      width: 1920
      height: 1088

  cam5_laundry:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://192.168.3.149/ch0_0.h264
          roles: [detect, record]
    detect:
      width: 1920
      height: 1088

  # Allwinner y20ga cameras report 1920x1080
  cam3_kitchen:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://192.168.3.3/ch0_0.h264
          roles: [detect, record]
    detect:
      width: 1920
      height: 1080

  cam6_extra:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://192.168.3.6/ch0_0.h264
          roles: [detect, record]
    detect:
      width: 1920
      height: 1080
version: 0.17-0
