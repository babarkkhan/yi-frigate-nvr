# Frigate 0.17.x - six local-only Yi cameras, GPU detection and live encoding.
# Recording/detection use one direct full-resolution camera input each.
# Corrected full-resolution live viewing adds one on-demand camera connection.
# Data-saver viewing consumes that LOCAL live stream, not a third camera input.
# See docs/setup-review-and-data-saver.md for architecture and operating limits.
#
# All six cameras emit PCM audio with a half-speed source clock. Full live feeds
# rebuild audio timestamps and reset copied video PTS/DTS to remove mux delay.
# Proven recording arguments remain separate and unchanged.
# Cam6 still has RTSP_STREAM=both on-camera; the other cameras use high.
# Do not enable extra camera streams as a shortcut to lower-bandwidth viewing.

mqtt:
  enabled: false

# Google authentication is enforced by the Hetzner gateway. Port 8971 also
# requires its secret and maps trusted headers to a read-only viewer.
# Port 5000 retains its existing trusted-LAN/tailnet behavior; never publish it.
auth:
  enabled: false
tls:
  enabled: false  # the 8971 hop stays inside loopback + encrypted SSH
proxy:
  auth_secret: "{FRIGATE_PROXY_SECRET}"
  default_role: viewer
  header_map:
    user: x-forwarded-user
    role: x-forwarded-groups
  logout_url: https://auth.example.com/oauth2/sign_out

go2rtc:
  # Optional cam1 live-talk pilot: provision the private bridge credentials and
  # VPS relay first. Replace this documentation-only address with the VPS IPv4.
  # See docs/cam1-native-live-talk.md before deploying this configuration.
  webrtc:
    listen: ":8555/tcp"
    candidates: ["203.0.113.10:8555"]
    ice_servers: []
    filters:
      candidates: []
      networks: ["tcp4"]
  ffmpeg:
    # GPU-only video resize/encode of the existing local full-resolution feed.
    # Audio stays on the corrected timeline: copy AAC and provide Opus too.
    mobile_input: "-hwaccel cuda -hwaccel_output_format cuda -fflags nobuffer -flags low_delay -timeout 5000000 -analyzeduration 1000000 -probesize 1000000 -rtsp_transport tcp -i {input}"
    mobile: "-c:v h264_nvenc -preset p2 -tune ull -zerolatency 1 -bf 0 -g 10 -r 10 -b:v 400k -maxrate:v 600k -bufsize:v 600k"
  streams:
    cam1_mensroom:
      - "ffmpeg:rtsp://192.168.3.5/ch0_0.h264#video=copy#audio=aac#audio=opus#raw=-bsf:v h264_metadata,setts=pts=PTS-STARTPTS:dts=DTS-STARTDTS -af asetpts=N/SR/TB"
      - "exec:python3 /config/live-talk/speaker_bridge.py#backchannel=1#audio=alaw/8000"
    cam2_living:
      - "ffmpeg:rtsp://192.168.3.22/ch0_0.h264#video=copy#audio=aac#audio=opus#raw=-bsf:v h264_metadata,setts=pts=PTS-STARTPTS:dts=DTS-STARTDTS -af asetpts=N/SR/TB"
    cam3_kitchen:
      - "ffmpeg:rtsp://192.168.3.3/ch0_0.h264#video=copy#audio=aac#audio=opus#raw=-bsf:v h264_metadata,setts=pts=PTS-STARTPTS:dts=DTS-STARTDTS -af asetpts=N/SR/TB"
    cam4_hallway:
      - "ffmpeg:rtsp://192.168.3.4/ch0_0.h264#video=copy#audio=aac#audio=opus#raw=-bsf:v h264_metadata,setts=pts=PTS-STARTPTS:dts=DTS-STARTDTS -af asetpts=N/SR/TB"
    cam5_laundry:
      - "ffmpeg:rtsp://192.168.3.149/ch0_0.h264#video=copy#audio=aac#audio=opus#raw=-bsf:v h264_metadata,setts=pts=PTS-STARTPTS:dts=DTS-STARTDTS -af asetpts=N/SR/TB"
    cam6_extra:
      - "ffmpeg:rtsp://192.168.3.6/ch0_0.h264#video=copy#audio=aac#audio=opus#raw=-bsf:v h264_metadata,setts=pts=PTS-STARTPTS:dts=DTS-STARTDTS -af asetpts=N/SR/TB"
    # Data-saver streams consume the local restream, not a third camera input.
    # -2 preserves aspect ratio: 960x544 on MStar, 960x540 on Allwinner.
    cam1_mensroom_mobile:
      - "ffmpeg:cam1_mensroom#input=mobile_input#video=mobile#audio=copy#audio=opus#raw=-vf scale_cuda=960:-2"
      - "exec:python3 /config/live-talk/speaker_bridge.py#backchannel=1#audio=alaw/8000"
    cam2_living_mobile:
      - "ffmpeg:cam2_living#input=mobile_input#video=mobile#audio=copy#audio=opus#raw=-vf scale_cuda=960:-2"
    cam3_kitchen_mobile:
      - "ffmpeg:cam3_kitchen#input=mobile_input#video=mobile#audio=copy#audio=opus#raw=-vf scale_cuda=960:-2"
    cam4_hallway_mobile:
      - "ffmpeg:cam4_hallway#input=mobile_input#video=mobile#audio=copy#audio=opus#raw=-vf scale_cuda=960:-2"
    cam5_laundry_mobile:
      - "ffmpeg:cam5_laundry#input=mobile_input#video=mobile#audio=copy#audio=opus#raw=-vf scale_cuda=960:-2"
    cam6_extra_mobile:
      - "ffmpeg:cam6_extra#input=mobile_input#video=mobile#audio=copy#audio=opus#raw=-vf scale_cuda=960:-2"

# ---------------------------------------------------------------------------
# Detector - RTX 4080 SUPER via ONNX/TensorRT
# ---------------------------------------------------------------------------
# Model built by scripts/build-yolo-model.sh (yolov9-t, 320x320).
# Frigate does not ship an ONNX model; it has to be exported once.
detectors:
  onnx:
    type: onnx

model:
  model_type: yolo-generic
  width: 320
  height: 320
  input_tensor: nchw
  input_dtype: float
  path: /config/model_cache/yolo.onnx
  labelmap_path: /labelmap/coco-80.txt

# ---------------------------------------------------------------------------
# Global defaults
# ---------------------------------------------------------------------------
ffmpeg:
  hwaccel_args: preset-nvidia

  # These cameras stall for seconds at a time under load. The stock
  # preset-rtsp-generic uses a 10s input timeout, and retry_interval
  # defaults to another 10s - so one brief stall cost 20s+ of recording.
  # Measured gaps of 30-70s per camera before this change.
  # 30s timeout rides through a stall instead of tearing the process down;
  # 3s retry gets it back faster when a teardown does happen.
  retry_interval: 3
  input_args:
    - -avoid_negative_ts
    - make_zero
    - -fflags
    - +genpts+discardcorrupt
    - -rtsp_transport
    - tcp
    - -timeout
    - "30000000"
    - -use_wallclock_as_timestamps
    - "1"

  output_args:
    # Preserve the measured MStar MP4 framing workaround. AUD/filler removal
    # was a disproven explanation: filters removing nothing also fix it.
    # Re-serialization works; the underlying cause remains unisolated.
    # See docs/recording-corruption.md. No video re-encode is performed.
    # This replaces preset-record-generic-audio-aac, matching it exactly plus
    # the bitstream filter.
    record:
      - -f
      - segment
      - -segment_time
      - "10"
      - -segment_format
      - mp4
      - -reset_timestamps
      - "1"
      - -strftime
      - "1"
      - -c:v
      - copy
      - -bsf:v
      - filter_units=remove_types=9|12
      - -c:a
      - aac

detect:
  enabled: true
  fps: 5

objects:
  track:
    - person

record:
  enabled: true
  continuous:
    days: 2
  alerts:
    retain:
      days: 14
      mode: motion
  detections:
    retain:
      days: 7
      mode: motion

snapshots:
  enabled: true
  retain:
    default: 14

# ---------------------------------------------------------------------------
# Cameras
# ---------------------------------------------------------------------------
cameras:
  # MStar y203c cameras report 1920x1088
  cam1_mensroom:
    enabled: true
    live:
      streams:
        Data saver: cam1_mensroom_mobile
        Full resolution: cam1_mensroom
    ffmpeg:
      inputs:
        - path: rtsp://192.168.3.5/ch0_0.h264
          roles: [detect, record]
    detect:
      width: 1920
      height: 1088

  cam2_living:
    enabled: true
    live:
      streams:
        Data saver: cam2_living_mobile
        Full resolution: cam2_living
    ffmpeg:
      inputs:
        - path: rtsp://192.168.3.22/ch0_0.h264
          roles: [detect, record]
    detect:
      width: 1920
      height: 1088

  cam4_hallway:
    enabled: true
    live:
      streams:
        Data saver: cam4_hallway_mobile
        Full resolution: cam4_hallway
    ffmpeg:
      inputs:
        - path: rtsp://192.168.3.4/ch0_0.h264
          roles: [detect, record]
    detect:
      width: 1920
      height: 1088

  cam5_laundry:
    enabled: true
    live:
      streams:
        Data saver: cam5_laundry_mobile
        Full resolution: cam5_laundry
    ffmpeg:
      inputs:
        - path: rtsp://192.168.3.149/ch0_0.h264
          roles: [detect, record]
    detect:
      width: 1920
      height: 1088

  # Allwinner y20ga cameras report 1920x1080
  cam3_kitchen:
    enabled: true
    live:
      streams:
        Data saver: cam3_kitchen_mobile
        Full resolution: cam3_kitchen
    ffmpeg:
      inputs:
        - path: rtsp://192.168.3.3/ch0_0.h264
          roles: [detect, record]
    detect:
      width: 1920
      height: 1080

  cam6_extra:
    enabled: true
    live:
      streams:
        Data saver: cam6_extra_mobile
        Full resolution: cam6_extra
    ffmpeg:
      inputs:
        - path: rtsp://192.168.3.6/ch0_0.h264
          roles: [detect, record]
    detect:
      width: 1920
      height: 1080
version: 0.17-0
