name: home-nvr

services:
  frigate:
    container_name: frigate
    # Frigate 0.18.0 (TensorRT), validated 2026-09-27 and pinned by digest.
    image: ghcr.io/blakeblackshear/frigate@sha256:82d7475ba7e5f950911bd9d06f2392de96881f39eeacd78824a526dde9b5cad9
    restart: unless-stopped
    stop_grace_period: 30s

    # shm_size computed from Frigate's formula, per camera:
    #   (width * height * 1.5 * 9 + 270480) / 1048576 MB
    #   1920x1088 -> 27.2 MB    x6 cameras -> 163 MB    + ~40 MB base
    # MEASURED 2026-08-23: actual usage was 361MB of 512MB (71%) - the formula
    # underestimates. Raised to 1gb. tmpfs only commits what is used, so the
    # extra costs nothing until needed.
    shm_size: "1gb"

    ports:
      - "5000:5000"     # web UI
      # Authenticated proxy endpoint for the outbound SSH gateway only.
      - "127.0.0.1:18971:8971"
      - "8554:8554"     # go2rtc RTSP restream
      - "8555:8555/tcp" # WebRTC
      - "8555:8555/udp"

    volumes:
      - ./services/nvr/config:/config
      - /mnt/d/frigate/media:/media/frigate
      - /etc/localtime:/etc/localtime:ro
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000

    # Required by the reviewed camera speaker bridges. Configuration access must
    # remain private: this opt-in allows command sources instance-wide.
    environment:
      GO2RTC_ALLOW_ARBITRARY_EXEC: "true"

    env_file:
      - ./secrets/frigate.env

    # WSL GPU device: retain access across systemd unit reloads.
    # Remove this WSL-specific mapping on a native Linux deployment.
    devices:
      - /dev/dxg:/dev/dxg

    # NVIDIA GPU. Requires the NVIDIA Container Toolkit inside WSL.
    # Comment this whole block out to run CPU-only.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

# WSL2's eth0 has an MTU of 1420, but Docker bridges default to 1500. Packets
# sized for 1500 are silently dropped crossing that boundary, so small requests
# succeed and anything larger hangs - which looked exactly like a TLS failure
# until a plain-HTTP request for a 6.8 KB page timed out the same way.
# 1280 is Tailscale's own default and leaves room for WireGuard overhead.
networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1280"
