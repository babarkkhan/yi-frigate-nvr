# Tailscale overlay - remote access without exposing anything to the internet.
#
#   docker compose -f compose.yaml -f compose.tailscale.yaml up -d
#
# Frigate is reached from any device on your tailnet. No port forwarding.
# Nothing is published to the public internet - Funnel is deliberately NOT
# enabled.
#
#   http://home-nvr:5000                        PREFERRED - ~12x faster
#   https://home-nvr.<your-tailnet>.ts.net      works, but slow
#
# Serve is terminated by netstack (userspace TCP) and never touches the kernel
# TUN, which makes it roughly 12x slower than the node's own port: the ~2MB
# Frigate UI takes 169s through Serve versus 14.5s direct. Plain HTTP over the
# tailnet is still inside WireGuard, so it is still encrypted end to end.
# Serve is kept here because it gives a real TLS certificate and a clean name.
#
# Kernel networking (TS_USERSPACE=false) is used, so /dev/net/tun, NET_ADMIN
# and NET_RAW are all required below.

services:
  tailscale:
    image: tailscale/tailscale:stable
    container_name: tailscale
    restart: unless-stopped
    env_file:
      - ./secrets/tailscale.env
    environment:
      # container hostname cannot be set alongside a shared network namespace,
      # so the tailnet name comes from TS_HOSTNAME instead
      TS_HOSTNAME: home-nvr
      TS_STATE_DIR: /var/lib/tailscale
      # Kernel networking, not userspace. Userspace netstack does not clamp TCP
      # MSS to the tailnet MTU here, so large responses were silently blackholed
      # while small ones succeeded. A real TUN device fixes that.
      TS_USERSPACE: "false"
      TS_SERVE_CONFIG: /config/serve.json
      TS_ENABLE_HEALTH_CHECK: "true"
    volumes:
      - ./runtime/tailscale:/var/lib/tailscale
      - ./services/tailscale:/config:ro
    # Tailscale Serve can only proxy to localhost - it ignores a hostname
    # target and dials 127.0.0.1 inside its own container. Sharing Frigate's
    # network namespace makes 127.0.0.1:5000 actually be Frigate.
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    network_mode: service:frigate

    # MEASURED 2026-09-06 and again 2026-09-12: after an unattended restart,
    # tailscaled came up with no UDP path at all and never recovered -
    # `netcheck` reporting `UDP: false` and `IPv4: (no addr found)`, the node
    # showing itself `offline`, and ~240 no-derp-connection events in 2 hours.
    # A manual `docker restart tailscale` fixed it both times, which is the
    # signature of a startup race rather than a network fault. Frigate owns the
    # network namespace here, so `condition: service_healthy` holds tailscaled
    # back until that namespace is actually ready. Plain `depends_on: [frigate]`
    # waits only for the container to START, which was not enough.
    depends_on:
      frigate:
        condition: service_healthy

    # Makes the above failure VISIBLE instead of silent. Both times, `docker ps`
    # cheerfully reported "Up N hours" while the tailnet was unreachable. This
    # surfaces it as "(unhealthy)". Docker will not restart on unhealthy by
    # itself - that still needs something watching - but at least the state is
    # no longer invisible. /healthz is served on 9002 by TS_ENABLE_HEALTH_CHECK
    # above and returns 503 when tailscaled considers itself unhealthy.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9002/healthz >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
